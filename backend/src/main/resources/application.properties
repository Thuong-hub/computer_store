spring.application.name=backend

spring.datasource.url=jdbc:mysql://localhost:3306/computer_store?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true

spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.expiration=86400000
jwt.secret=${JWT_SECRET:Q29tcHV0ZXJTdG9yZUpXVFNlY3JldEtleTIwMjZGb3JEZXZlbG9wbWVudA==}

spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

sepay.bank.account=${SEPAY_BANK_ACCOUNT:0123456789}
sepay.payment.prefix=${SEPAY_PAYMENT_PREFIX:CS}
sepay.webhook.secret=${SEPAY_WEBHOOK_SECRET:}
sepay.webhook.auth-mode=${SEPAY_WEBHOOK_AUTH_MODE:HMAC}
sepay.webhook.api-key=${SEPAY_WEBHOOK_API_KEY:}
sepay.webhook.allow-no-auth=${SEPAY_WEBHOOK_ALLOW_NO_AUTH:false}

# Tự động gán Bestseller (giảm 10%) cho sản phẩm bán chạy - có thể chỉnh
store.bestseller.top-n=10
store.bestseller.window-days=30
store.bestseller.min-units=3

# ================= SMTP (gửi mail xác minh / quên mật khẩu / đổi email) =================
# KHÔNG ghi tài khoản Gmail / mật khẩu thật vào file này (file được đưa lên GitHub).
# Cách cấu hình (chọn 1):
#   1) Đặt biến môi trường SMTP_USER và SMTP_PASSWORD trước khi chạy backend, hoặc
#   2) Copy backend/config/application.properties.example thành backend/config/application.properties
#      rồi điền thông tin (file này đã được .gitignore, Spring Boot tự nạp và ưu tiên hơn file này).
# SMTP_PASSWORD là "Mật khẩu ứng dụng" 16 ký tự của Gmail (Tài khoản Google > Bảo mật > Xác minh 2 bước > Mật khẩu ứng dụng),
# KHÔNG phải mật khẩu đăng nhập. Nếu để trống, các chức năng gửi email sẽ không hoạt động.
SMTP_HOST=smtp.gmail.com
SMTP_PORT=587
SMTP_AUTH=true
SMTP_STARTTLS=true
SMTP_USER=
SMTP_PASSWORD=
SMTP_FROM=${SMTP_USER}

# Địa chỉ gốc dùng để tạo link trong email (đặt lại mật khẩu...)
PUBLIC_BASE_URL=http://localhost:8080

# ================= Black Friday tự động =================
# Từ 01/11 đến ngày Black Friday, nếu năm đó admin chưa cấu hình gì thì tự tạo lịch Black Friday
# cho top sản phẩm bán chạy. Nếu admin đã tạo/tắt lịch của năm đó thì hệ thống KHÔNG ghi đè.
store.blackfriday.auto-enabled=true
store.blackfriday.top-n=10
store.blackfriday.window-days=30
store.blackfriday.min-units=1
# Mức giảm Black Friday cố định 30%
